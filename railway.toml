# Railway deploy config for the `nightcode` server, checked in so the settings
# live in git rather than in dashboard clicks. Railway's precedence rule is
# absolute — "configuration defined in code will always override values from the
# dashboard" — so this file is the single source of truth and a half-configured
# dashboard can no longer change the outcome.
#
# Root Directory stays `/` (NOT apps/server): the server depends on
# `nightcode-ai` and `nightcode-database` as `workspace:*`, so the whole
# workspace has to install. See README.md for the click-through steps.

[build]
builder = "RAILPACK"

# Explicitly `db:generate`, NOT the auto-detected root `build` script. Railpack
# runs `build` from package.json when no command is given, and ours is
# `bun --filter '*' build`, which also bundles the CLI — so a CLI-side breakage
# would block server deploys for no reason. The server needs no build step at
# all; `bun run start` runs it straight from TypeScript source. Generating the
# Prisma client is the only genuine build-time requirement, and naming it here
# also stops the deploy from depending on `packages/database`'s `postinstall`
# firing (which itself only works because of root `trustedDependencies`).
buildCommand = "bun run db:generate"

# Scoped so CLI-only commits don't trigger a server redeploy.
#
# The last three are not server source, but every one of them changes how the
# host builds or runs — and a file that can break the build while being unable to
# TRIGGER one is a trap: you push a fix, nothing redeploys, and the dashboard
# still shows the old failure. `railway.toml` has to list itself for that reason.
watchPatterns = [
  "apps/server/**",
  "packages/**",
  "package.json",
  "bun.lock",
  "railway.toml",
  ".bun-version",
  "bunfig.toml",
]

[deploy]
# `bun run start`, not `start:server` — the latter hard-codes `--env-file=.env`,
# a gitignored file that does not exist on the host. Real env vars are injected
# by Railway.
startCommand = "bun run start"

# `/health` is registered BEFORE `authMiddleware` in apps/server/src/app.ts, so
# it answers without a token. Every other path (including `/`) correctly 401s,
# which is why the probe cannot point at `/`.
healthcheckPath = "/health"
healthcheckTimeout = 300

# Both Clerk keys are read at import time by middleware/auth.ts, so a missing or
# empty one crash-loops the container rather than serving 500s — the log line
# names the variable.
#
# No `restartPolicyMaxRetries` cap on purpose. Capping it (this was set to 3)
# makes a transient boot failure permanent: once the retries are spent Railway
# stops trying, the container stays down, and the edge serves
# `502 Application failed to respond` with `x-railway-fallback: true` forever —
# indistinguishable from a routing problem. Railway's default retry count is the
# right trade here; find the crash in the deploy logs instead.
restartPolicyType = "ON_FAILURE"
